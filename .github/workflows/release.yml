name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The precompiled base jar the JDK-free `mcgraft pack` splices payloads into.
  base:
    name: Build base jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew agentBase --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: mc-graft-base
          path: build/agent/mc-graft-base.jar
          if-no-files-found: error

  # The control app (CLI + GUI). Built per Linux arch on a NATIVE runner (so both mcgraft and its embedded krak2 are the
  # target's architecture — no cross-compilation). Linux-only: inject discovers JVMs via /proc and attaches over the
  # Unix-socket HotSpot protocol, so macOS/Windows are out of scope.
  binary:
    name: Build mcgraft (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    name: linux-x86_64,  artifact: mcgraft-linux-x86_64 }
          - { runner: ubuntu-24.04-arm, name: linux-aarch64, artifact: mcgraft-linux-aarch64 }
    defaults:
      run:
        working-directory: ctl
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      # Pinned by commit: @stable is a BRANCH, so the tag-immutability argument doesn't even apply there. The toolchain
      # is now named explicitly because a bare SHA no longer says which one (the action's own default is `stable`).
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4   # stable branch @ 2026-07-25
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ctl
          key: ${{ matrix.name }}
      - name: Build krak2 (Krakatau) to embed
        working-directory: .
        env:
          KRAK2_COMMIT: ae49743af92bbab1684b19bb1bee22b0a64d8ce5   # pinned Krakatau v2 (do not float on branch HEAD)
        run: |
          git clone https://github.com/Storyyeller/Krakatau /tmp/krakatau
          git -C /tmp/krakatau checkout "$KRAK2_COMMIT"
          cargo build --release --manifest-path /tmp/krakatau/Cargo.toml
      - name: Build mcgraft (embedding krak2 so .j patches are self-contained)
        env:
          MCGRAFT_BUNDLE_KRAK2: /tmp/krakatau/target/release/krak2
        run: cargo build --release
      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/release/mcgraft "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ctl/dist/${{ matrix.artifact }}
          if-no-files-found: error

  # Build jattach.exe with MSVC (cl) in an ISOLATED job — msvc-dev-cmd reorders PATH so Git's link.exe shadows the MSVC
  # linker, which breaks Rust builds; keeping it out of the Rust job avoids that. JATTACH_VERSION IS required (main() is
  # inside #ifdef JATTACH_VERSION); the \"..\" quoting matches jattach's Makefile — cmd passes \" through, cl unescapes it.
  jattach-windows:
    name: Build jattach.exe
    runs-on: windows-latest
    steps:
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756   # v1.13.0
      - name: Build jattach v2.2
        shell: cmd
        env:
          # Pinned by commit, not by the mutable v2.2 tag: this binary is embedded into every released mcgraft.exe, and
          # the copy vendored under tool/ is SHA-256 verified before it runs — the release path must be no weaker.
          JATTACH_COMMIT: 030d74328bd6b04114f804ba1b4de2ddfa031b55   # v2.2
        run: |
          git clone https://github.com/jattach/jattach jattach
          git -C jattach checkout %JATTACH_COMMIT%
          cd jattach
          cl /O2 /D_CRT_SECURE_NO_WARNINGS /DJATTACH_VERSION=\"2.2\" /Fejattach.exe src\windows\jattach.c advapi32.lib /link /SUBSYSTEM:CONSOLE,5.02
      - uses: actions/upload-artifact@v4
        with:
          name: jattach-windows
          path: jattach/jattach.exe
          if-no-files-found: error

  # The control app on Windows (MSVC), embedding krak2.exe (patch assembly) + jattach.exe (inject). No msvc-dev-cmd here,
  # so the Rust builds use their normal MSVC linker resolution.
  binary-windows:
    name: Build mcgraft (windows-x86_64)
    needs: jattach-windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ctl
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4   # stable branch @ 2026-07-25
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ctl
          key: windows-release
      - name: Download jattach.exe
        uses: actions/download-artifact@v4
        with:
          name: jattach-windows
          path: ${{ runner.temp }}/jattach
      - name: Build krak2.exe (Krakatau) to embed
        working-directory: .
        env:
          KRAK2_COMMIT: ae49743af92bbab1684b19bb1bee22b0a64d8ce5   # pinned Krakatau v2
        run: |
          git clone https://github.com/Storyyeller/Krakatau "$RUNNER_TEMP/krakatau"
          git -C "$RUNNER_TEMP/krakatau" checkout "$KRAK2_COMMIT"
          cargo build --release --manifest-path "$RUNNER_TEMP/krakatau/Cargo.toml"
      - name: Build mcgraft (embedding krak2.exe + jattach.exe)
        env:
          # build.rs needs Windows paths; cygpath -w converts the bash paths.
          KRAK2_RAW: ${{ runner.temp }}/krakatau/target/release/krak2.exe
          JATTACH_RAW: ${{ runner.temp }}/jattach/jattach.exe
        run: |
          export MCGRAFT_BUNDLE_KRAK2="$(cygpath -w "$KRAK2_RAW")"
          export MCGRAFT_BUNDLE_JATTACH="$(cygpath -w "$JATTACH_RAW")"
          cargo build --release
      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/release/mcgraft.exe dist/mcgraft-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: mcgraft-windows-x86_64
          path: ctl/dist/mcgraft-windows-x86_64.exe
          if-no-files-found: error

  # Attach all artifacts to the GitHub release for the pushed tag.
  release:
    name: Publish release
    needs: [base, binary, binary-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2.6.2
        with:
          files: |
            artifacts/mc-graft-base/mc-graft-base.jar
            artifacts/mcgraft-linux-x86_64/mcgraft-linux-x86_64
            artifacts/mcgraft-linux-aarch64/mcgraft-linux-aarch64
            artifacts/mcgraft-windows-x86_64/mcgraft-windows-x86_64.exe
          generate_release_notes: true
