# Meteor Client is a standard ModInitializer (client entrypoint MeteorClient), so no event-bootstrap override is
# needed. It only requires one thing on late-attach: its static initializer reads its OWN mod metadata via
# FabricLoader.getModContainer("meteor-client").orElseThrow(), which the loader doesn't know about post-attach.
# Register the payload as a synthetic ModContainer so that resolves.
#
# Build:  ./gradlew agentJar -Ppayload=meteor-client.jar -PbootstrapConfig=examples/meteor/bootstrap.properties
bootstrap.registerModContainer=true
