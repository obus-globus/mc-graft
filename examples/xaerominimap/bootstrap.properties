# Xaero's Minimap (fabric-26.2-26.4.2). A normal Fabric CLIENT-entrypoint mod (no event bootstrap needed), but it
# exercises several fabric-api integration points that a late-attach must stand in for.
#
# Pack with:  mcgraft pack -p xaerominimap-fabric-26.2-26.4.2.jar -c examples/xaerominimap/bootstrap.properties
#
# fabric-api is required at runtime (declared, not bundled). xaerolib is bundled as a jar-in-jar and is initialised
# automatically (the packer prepends its entrypoint).
payload.dependencies=net.fabricmc.fabric-api:fabric-api:0.153.0+26.2

# Xaero reads its own mod version from the Fabric ModContainer during init; synthesise one for late-attach.
bootstrap.registerModContainer=true

# Xaero registers keybinds during its (deferred) client init; fabric-api rejects registration post-GameOptions. Reopen it.
bootstrap.reopenKeyBindings=true

# Xaero syncs over a custom packet channel (xaerominimap:main). fabric-api's networking mixins (which wire mod payloads
# into MC's packet codec) are not applied under late-attach, so bridge fabric-api's PayloadTypeRegistry into MC's live
# custom-payload codec dispatch instead. With this, the client connects to a world without the encode ClassCastException.
bootstrap.bridgePayloadCodecs=true

# STATUS: the client fully initialises (all three Xaero load stages) and connects to a world. KNOWN LIMITATION: in
# SINGLEPLAYER, Xaero's server-side companion (xaero.common.server session `serverData`) is not initialised under
# late-attach — its server bootstrap depends on further fabric-api hooks that mc-graft does not stand in for — so the
# integrated server disconnects the client on world join (gui.xaero_error_loading_properties). The minimap's client
# rendering + keybinds are in place; the server-companion gap is documented in TODO.md.
