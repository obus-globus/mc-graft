# LiquidBounce has NO fabric entrypoint (fabric.mod.json entrypoints.main == []); it initializes via a mixin that
# fires ClientStartEvent during client startup. Post-attach that trigger has already passed, so mc-graft must dispatch
# the event manually. LB then initializes asynchronously, so a readiness probe gates publishing the target retransforms.
#
# Pass with:  -PbootstrapConfig=examples/liquidbounce/bootstrap.properties
bootstrap.event.manager=net.ccbluex.liquidbounce.event.EventManager
bootstrap.event.managerInstance=INSTANCE
bootstrap.event.base=net.ccbluex.liquidbounce.event.Event
bootstrap.event.start=net.ccbluex.liquidbounce.event.events.ClientStartEvent
bootstrap.event.startInstance=INSTANCE
bootstrap.event.call=callEvent
# async readiness probe: publish retransforms only once LiquidBounce.INSTANCE.isInitialized() == true
bootstrap.ready.class=net.ccbluex.liquidbounce.LiquidBounce
bootstrap.ready.instance=INSTANCE
bootstrap.ready.method=isInitialized
# NeoForge-patched MC needs LB's neoforge companion config set instead of the fabric one
payload.mixins.neoforge=liquidbounce.mixins.json,liquidbounce-neoforge.mixins.json

# External dependency mods LiquidBounce needs (it declares fabric-language-kotlin; fabric-api is required at runtime).
# Resolved from Maven at build time and staged by the agent (its jar-in-jar contents are extracted automatically).
payload.dependencies=net.fabricmc.fabric-api:fabric-api:0.153.0+26.2,net.fabricmc:fabric-language-kotlin:1.13.12+kotlin.2.4.0

# LiquidBounce REQUIRES the bootstrap resource reload. Measured on a real client: with this off, LB prints its
# "Launching LiquidBounce v0.39.0" banner and then stops — no "successfully initialized", no UI. LB defers its real
# init to a resource-reload listener registered during ClientStartEvent, and under late attach the boot-time reload
# has long passed, so without a driven reload that listener never fires.
#
# A local harness once measured the opposite (LB reaching "successfully initialized" with the reload off) and this
# file was set to false on the strength of it. That was wrong on a real client. Do not re-disable it without a log
# from an actual game showing LB completing init.
#
# The reload does have a real cost, which is what bootstrap.reloadAfterActivation exists to pay off: mc-graft
# publishes the payload's mixins only AFTER the readiness probe passes, so the bootstrap reload necessarily runs
# against the pristine game. MC's ShaderManager#apply calls GpuDevice.clearPipelineCache() and re-precompiles only
# RenderPipelines.getStaticPipelines() (vanilla's). LB's pipelines are restored by its own MixinShaderManager TAIL
# inject — exactly the hook that is not live yet — so they are wiped with nothing to repopulate them, and each is
# then lazily recompiled against MC's resource-backed shader source, which has no `liquidbounce:` namespace ->
# "Couldn't find source for FRAGMENT shader (liquidbounce:shader/fragment/blur_h)" and an invisible UI.
# reloadAfterActivation (default true) drives one more reload once the mixins ARE live, which is what lets LB's own
# hook rebuild them.
#
# CORRECTION (measured on LB 0.39.0, local 26.2 client): the claim that once stood here — "LB's own
# ClientRenderPipelines.ensureCompiled() self-heal is one-shot (guarded by a `precompiled` flag)" — does not hold for
# this build. There is no such flag: ClientRenderPipelines has NO boolean field at all (read reflectively out of the
# live class), and `precompile()` in LB's source is unguarded, so every reload re-runs it. The repair therefore works,
# and works repeatedly. Measured: "Loaded 38 Render Pipelines." at the TAIL of the post-activation reload, and the
# six shader errors this comment was written about are down to one.
#
# That last one is a RACE, not a hole in the repair, and reloadAfterActivation cannot close it. Measured ordering:
#   14:30:41  liquidbounce initialization completed
#   14:30:42  reloadResourcePacks() again (post-activation) is REQUESTED
#   14:30:42  the browser draws -> Blaze3D lazily compiles liquidbounce:pipeline/jcef/bgra_blurred_texture through
#             the GpuDevice's DEFAULT (resource-backed) ShaderSource -> "Couldn't find source for FRAGMENT shader
#             (liquidbounce:shader/fragment/bgra_pos_tex_color)"      <- the one remaining error, exactly once
#   14:30:44  the reload actually begins
#   14:30:45  MixinShaderManager TAIL -> ClientRenderPipelines.precompile() -> "Loaded 38 Render Pipelines."
# The source is NOT missing: LB's own ClientShaders holds all 13 fragment sources including bgra_pos_tex_color
# (verified by reading the live map). It is only reachable via gpuDevice.precompilePipeline(pipeline, ClientShaders),
# which runs ~3s too late because the browser opens before the reload completes. Cosmetic: the pipeline compiles
# correctly in the precompile pass, and the browser reaches httpStatusCode=200 and renders.
bootstrap.reloadResources=true

# LB registers custom sounds (e.g. liquidbounce:bonk) into the frozen sound_event registry during init. With
# reloadResources off the engine thaws ALL registries for the bootstrap and restores them after (no reload to collide
# with), so this scoped list is inert — kept as documentation of what LB writes to, and it takes effect again if
# anyone re-enables the reload.
bootstrap.thawRegistries=minecraft:sound_event

# Registering the sound EVENTS (above) is only half of it: the .ogg FILES live in the payload's assets/ and are read
# through the resource manager, which under late attach has no 'liquidbounce' namespace at all. Measured on a local
# 26.2 client, LB alone, two runs differing only in this line:
#
#   registerModContainer off -> 26x "Missing sound for event: liquidbounce:<name>" — every sound LB ships, silent
#   registerModContainer on  ->  1x, and the live resource manager gains the namespace
#                                (49 -> 50 namespaces, 48 -> 49 packs, listResources(sounds, ns=liquidbounce) 0 -> 26)
#
# It needs reloadResources=true (already set above) to take effect: the container makes LB a mod, and only the reload
# re-runs Fabric's ModResourcePackCreator so the pack is actually discovered. Container-WITHOUT-reload was not tested
# here; see PayloadResources for why it is not expected to suffice on its own.
#
# Scope, stated narrowly because the obvious over-read is wrong: this buys SOUNDS AND NOTHING ELSE. assets/ in the
# LiquidBounce jar contains ONLY sounds/ and sounds.json (34 entries, all audio). Its shaders, logo, lang files and
# browser theme all live under resources/liquidbounce/ — a plain classpath directory, not a resource-pack path, read
# with getResourceAsStream and never through the resource manager. (fabric.mod.json's own "icon" points into it, which
# is the giveaway.) Measured: with this flag on, "Missing resource liquidbounce:logo" (2x) and "Couldn't find source
# for FRAGMENT shader" (1x) are identical to the run without it. Do not expect this line to move either.
#
# The one remaining sound warning is an upstream LB packaging bug nothing here can fix: sounds.json declares events
# "magicsquash" and "click", but the shipped files are magic_squash.ogg and click-1/2/3.ogg. Turning this flag on is
# what makes that bug visible ("File liquidbounce:sounds/click.ogg does not exist") instead of silent.
bootstrap.registerModContainer=true

# ---------------------------------------------------------------------------------------------------------------
# KNOWN COSMETIC SYMPTOM, NOT FIXABLE FROM THIS FILE: "Missing resource liquidbounce:logo referenced from
# liquidbounce:logo" (2x per run). LB registers its splash logo from MixinLoadingOverlay:
#     @Inject(method = "registerTextures", at = @At("RETURN"))
#     static void initializeTexture(TextureManager tm, CallbackInfo ci) {
#         tm.registerAndLoad(ClientLogoTexture.CLIENT_LOGO, new ClientLogoTexture()); }
# LoadingOverlay.registerTextures(TextureManager) is `public static` and is called EXACTLY ONCE, from
# Minecraft.<init> (verified by disassembling the 26.2 client jar: the only call site is at offset 3019 inside the
# constructor). No resource reload re-runs it. Under late attach that call is long past before the payload's mixins
# exist, so LB's registration can never fire — reloadResources / reloadAfterActivation are irrelevant to it.
# Downstream, TextureManager.getTexture(liquidbounce:logo) finds nothing registered and lazily substitutes a
# SimpleTexture, which looks for assets/liquidbounce/textures/logo.png in the resource manager. That file does not
# exist in the jar (the real image is the classpath resource resources/liquidbounce/logo_banner.png, which
# ClientLogoTexture reads directly), so the lookup misses and MC warns. Confirmed live: the TextureManager map holds
# `liquidbounce:logo -> SimpleTexture`, not ClientLogoTexture.
# Fixing it would mean calling LoadingOverlay.registerTextures again post-activation, i.e. re-running an arbitrary
# constructor-time hook for its side effects — out of scope for a cosmetic warning about a splash screen that has
# already been dismissed.
# ---------------------------------------------------------------------------------------------------------------

# LiquidBounce reads this system property to locate its data directory; point it at the client's real game dir.
bootstrap.gameDirProperty=vspike.gameDir

# Defer a multiplayer connect issued mid-attach until LB has initialized (gate MC's ConnectScreen.startConnecting).
# Omit to disable the join-gate feature entirely.
bootstrap.joinGate.screen=net/minecraft/client/gui/screens/ConnectScreen
