# LiquidBounce has NO fabric entrypoint (fabric.mod.json entrypoints.main == []); it initializes via a mixin that
# fires ClientStartEvent during client startup. Post-attach that trigger has already passed, so mc-graft must dispatch
# the event manually. LB then initializes asynchronously, so a readiness probe gates publishing the target retransforms.
#
# Pass with:  -PbootstrapConfig=examples/liquidbounce/bootstrap.properties
bootstrap.event.manager=net.ccbluex.liquidbounce.event.EventManager
bootstrap.event.managerInstance=INSTANCE
bootstrap.event.base=net.ccbluex.liquidbounce.event.Event
bootstrap.event.start=net.ccbluex.liquidbounce.event.events.ClientStartEvent
bootstrap.event.startInstance=INSTANCE
bootstrap.event.call=callEvent
# async readiness probe: publish retransforms only once LiquidBounce.INSTANCE.isInitialized() == true
bootstrap.ready.class=net.ccbluex.liquidbounce.LiquidBounce
bootstrap.ready.instance=INSTANCE
bootstrap.ready.method=isInitialized
# NeoForge-patched MC needs LB's neoforge companion config set instead of the fabric one
payload.mixins.neoforge=liquidbounce.mixins.json,liquidbounce-neoforge.mixins.json

# External dependency mods LiquidBounce needs (it declares fabric-language-kotlin; fabric-api is required at runtime).
# Resolved from Maven at build time and staged by the agent (its jar-in-jar contents are extracted automatically).
payload.dependencies=net.fabricmc.fabric-api:fabric-api:0.153.0+26.2,net.fabricmc:fabric-language-kotlin:1.13.12+kotlin.2.4.0

# DO NOT drive a resource reload for LiquidBounce.
#
# It was once needed because LB deferred real init to a resource-reload listener. On MC 26.2 it no longer does:
# `mc.resourceManager` is not a ReloadableResourceManager when LB's ClientStartEvent handler runs, so LB logs
# "Failed to register resource reloader!" and calls initializeClient() directly from the event. Measured: with the
# reload off LB still reaches "LiquidBounce has been successfully initialized" + "Loaded 38 Render Pipelines."
#
# Worse, the reload is actively harmful here. mc-graft publishes the payload's mixins only AFTER the readiness probe
# passes, so any reload it drives runs against the pristine game — and MC's ShaderManager#apply calls
# GpuDevice.clearPipelineCache() and then re-precompiles only RenderPipelines.getStaticPipelines() (vanilla's).
# LB's pipelines are restored by its own MixinShaderManager TAIL inject, which is exactly the hook that is not live
# yet. Net effect: every LB pipeline is wiped from the GPU cache with nothing to repopulate it, and each one is then
# lazily recompiled against MC's default (resource-backed) shader source, which has no `liquidbounce:` namespace ->
# "Couldn't find source for FRAGMENT shader (liquidbounce:shader/fragment/blur_h)" and an invisible UI.
# LB's own ClientRenderPipelines.ensureCompiled() self-heal is one-shot (guarded by a `precompiled` flag), so it
# cannot repair a wipe that happens after it has already run.
#
# The predecessor LB-specific injector had no reload feature at all and loaded LB's UI fine; this matches it.
bootstrap.reloadResources=false

# LB registers custom sounds (e.g. liquidbounce:bonk) into the frozen sound_event registry during init. With
# reloadResources off the engine thaws ALL registries for the bootstrap and restores them after (no reload to collide
# with), so this scoped list is inert — kept as documentation of what LB writes to, and it takes effect again if
# anyone re-enables the reload.
bootstrap.thawRegistries=minecraft:sound_event

# LiquidBounce reads this system property to locate its data directory; point it at the client's real game dir.
bootstrap.gameDirProperty=vspike.gameDir

# Defer a multiplayer connect issued mid-attach until LB has initialized (gate MC's ConnectScreen.startConnecting).
# Omit to disable the join-gate feature entirely.
bootstrap.joinGate.screen=net/minecraft/client/gui/screens/ConnectScreen
