[package]
name = "mcgraft"
version = "0.1.0"
edition = "2021"
description = "Control CLI for mc-graft: discover running Minecraft JVMs and inject the mc-graft agent via the HotSpot attach protocol."
license = "MIT"

[[bin]]
name = "mcgraft"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
opt-level = "z"

# Lint policy (the project's Rust linter). `cargo clippy` enforces this locally; CI additionally runs
# `cargo clippy --all-targets -- -D warnings`. Kept in the manifest so the policy travels with the crate.
[lints.rust]
# "deny", not "forbid", for exactly one reason: main::detach_console needs a single FFI call to FreeConsole so the GUI
# doesn't leave an orphan console window on Windows. That one call carries an explicit #[allow(unsafe_code)]; every
# other unsafe block in the crate is still a hard error, so the exception stays visible and auditable.
unsafe_code = "deny"
[lints.clippy]
all = { level = "deny", priority = -1 }   # deny the full default clippy set (correctness/suspicious/style/complexity/perf)

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.28"
rfd = "0.14"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
cafebabe = "0.8"
toml = "0.8"
sha2 = "0.10"
ristretto_classfile = "0.30.0"
tempfile = "3.27.0"
json-patch = "4.2.0"

[target."cfg(windows)".dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
