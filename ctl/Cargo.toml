[package]
name = "mcgraft"
version = "0.1.0"
edition = "2021"
description = "Control CLI for mc-graft: discover running Minecraft JVMs and inject the mc-graft agent via the HotSpot attach protocol."
license = "MIT"

[[bin]]
name = "mcgraft"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
opt-level = "z"

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.28"
rfd = "0.14"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
